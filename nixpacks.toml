providers = ["php"]

[phases.build]
cmds = [
    "mkdir -p /var/log/nginx",
    "chmod -R 777 /var/log/nginx",
    "touch /var/log/nginx/error.log",
    "touch /var/log/nginx/access.log",
    "npm run build",
    "mkdir -p storage/framework/{sessions,views,cache}",
    "chmod -R 777 storage bootstrap/cache"
]
